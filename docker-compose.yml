services:
  app:
    build: .
    ports:
      - "3001:3000"
    env_file: .env
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sikalock
      POSTGRES_USER: sikalock
      POSTGRES_PASSWORD: sikalock
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  pgdata:
